# Install once: `uvx pre-commit install`
repos:
  - repo: local
    hooks:
      - id: no-private-data
        name: no statements, databases or exports
        entry: python scripts/check_no_private_data.py
        language: system
        pass_filenames: true
      - id: ruff
        name: ruff (lint + format check)
        entry: uv --project backend run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv --project backend run ruff format
        language: system
        types: [python]
      - id: prettier
        name: prettier
        entry: npm --prefix frontend exec -- prettier --write --ignore-unknown
        language: system
        files: ^frontend/src/
