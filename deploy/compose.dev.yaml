# Development services: Postgres + Redis only. The app itself runs on the host (`uv run finboard dev`).
# Both services bind to loopback; the passwords here are for local development only.
name: finboard-dev

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_dev
      FINBOARD_OWNER_PASSWORD: finboard_owner_dev
      FINBOARD_APP_PASSWORD: finboard_app_dev
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - db-data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d finboard"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    # No persistence: Redis only holds queued jobs and short-lived secrets.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  db-data:
